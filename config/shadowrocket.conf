# Shadowrocket manual routing v8 | 2026-11-26
# PROXY follows the node selected on Home. No node or subscription names required.
# Remote rules: blackmatrix7/ios_rule_script (master).
# DIRECT intentionally uses local encrypted DNS; test all three proxy paths.
[General]
update-url = https://raw.githubusercontent.com/jaychen1230/Shadowrocket-Config/main/config/shadowrocket.conf
dns-server = https://dns.google/dns-query#proxy
direct-dns-server = https://223.5.5.5/dns-query
fallback-dns-server = https://cloudflare-dns.com/dns-query#proxy
proxy-dns-server = https://223.5.5.5/dns-query
dns-fallback-system = false
dns-direct-system = false
dns-direct-fallback-proxy = false
always-ip-address = false
allow-dns-svcb = false
ipv6 = false
prefer-ipv6 = false
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53
udp-policy-not-supported-behaviour = REJECT
close-if-proxy-chain-missing = true
block-quic = all-proxy

[Proxy Group]
# Experimental single-layer dynamic membership; verify built-in policies on device.
# No country filters, automatic speed tests, or automatic node failover.
AI服务 = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY
Google = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY
YouTube = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY
Games = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY
测速工具 = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY
Streaming = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY
Telegram = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY
GitHub = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY
Social = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY
Apple = select,DIRECT,PROXY,include-all-proxies=true,policy-select-name=DIRECT
Microsoft = select,DIRECT,PROXY,include-all-proxies=true,policy-select-name=DIRECT
China = select,DIRECT,PROXY,include-all-proxies=true,policy-select-name=DIRECT
Final = select,PROXY,DIRECT,include-all-proxies=true,policy-select-name=PROXY

